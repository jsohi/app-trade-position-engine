plugins {
    id 'java'
    id 'java-library'
    id 'application'
    id 'idea'
}

application {
    mainClass = 'com.bofa.equity.TradePositionEngineApp'
    applicationDefaultJvmArgs = [
        '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
        '--add-opens', 'java.base/jdk.internal.misc=ALL-UNNAMED'
    ]
}

defaultTasks 'clean', 'build', 'test'

ext {
    appGroup          = 'com.bofa.equity'
    appVersion        = '1.0.0-SNAPSHOT'
    javaVersion       = JavaVersion.VERSION_25
    AERON_VERSION     = '1.50.1'
    AGRONA_VERSION    = '2.4.0'
    SBE_VERSION       = '1.37.1'
    DECIMAL_4J_VERSION  = '1.0.3'  // garbage free decimal operations
    HDR_HISTOGRAM_VERSION = '2.2.2' // latency capture library with plotting
    AFFINITY_VERSION    = '2026.2' // OpenHFT thread-to-core pinning
    LOG4J_VERSION       = '2.24.3' // Log4j2 implementation + SLF4J 2.x bridge
    DISRUPTOR_VERSION   = '4.0.0'  // LMAX Disruptor — required for Log4j2 async garbage-free logging
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'idea'

    group appGroup
    version appVersion

    compileJava {
        sourceCompatibility = javaVersion
        targetCompatibility = javaVersion
        options.compilerArgs.addAll(['--add-exports', 'java.base/sun.nio.ch=ALL-UNNAMED'])
        options.encoding = 'UTF-8'
        options.deprecation = true
    }

    compileTestJava {
        sourceCompatibility = javaVersion
        targetCompatibility = javaVersion
        options.compilerArgs.addAll(['--add-exports', 'java.base/sun.nio.ch=ALL-UNNAMED'])
        options.encoding = 'UTF-8'
        options.deprecation = true
    }

    repositories {
        mavenCentral()
    }

    idea {
        module {
            downloadJavadoc = true
            downloadSources = true
        }
    }
}


dependencies {
    implementation project(':shared')
    implementation project(':publisher')
    implementation project(':receiver')
    testRuntimeOnly project(':media-driver')
    runtimeOnly group: 'org.apache.logging.log4j', name: 'log4j-core', version: LOG4J_VERSION
    runtimeOnly group: 'com.lmax', name: 'disruptor', version: DISRUPTOR_VERSION
    implementation group: 'io.aeron', name: 'aeron-all', version: AERON_VERSION
    implementation group: 'org.agrona', name: 'agrona', version: AGRONA_VERSION
    implementation group: 'net.openhft', name: 'affinity', version: AFFINITY_VERSION
    testRuntimeOnly group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.11.4'
    testRuntimeOnly group: 'org.junit.platform', name: 'junit-platform-launcher', version: '1.11.4'
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.11.4'
    testImplementation group: 'io.cucumber', name: 'cucumber-java',                     version: '7.21.0'
    testImplementation group: 'io.cucumber', name: 'cucumber-junit-platform-engine',     version: '7.21.0'
    testImplementation group: 'io.cucumber', name: 'cucumber-picocontainer',             version: '7.21.0'
    testImplementation group: 'org.junit.platform', name: 'junit-platform-suite',        version: '1.11.4'
    testRuntimeOnly    group: 'org.junit.platform', name: 'junit-platform-suite-engine', version: '1.11.4'
}

test {
    useJUnitPlatform()
    jvmArgs('--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED')
    jvmArgs('--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED')
    jvmArgs('--add-opens', 'java.base/jdk.internal.misc=ALL-UNNAMED')
    testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

// Downloads source JARs for all compile-classpath dependencies into build/dependency-sources/.
// Usage: ./gradlew downloadSources
// Sources are then readable at build/dependency-sources/<artifact>-sources.jar
tasks.register('downloadSources') {
    group = 'documentation'
    description = 'Downloads source JARs for all compile-classpath dependencies'
    dependsOn(configurations.compileClasspath)

    doLast {
        def sourcesDir = file("$buildDir/dependency-sources")
        sourcesDir.mkdirs()

        configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            def id = artifact.moduleVersion.id
            try {
                def sourcesConfig = configurations.detachedConfiguration(
                    dependencies.create("${id.group}:${id.name}:${id.version}:sources")
                )
                sourcesConfig.resolvedConfiguration.resolvedArtifacts.each { src ->
                    ant.copy(file: src.file, todir: sourcesDir, overwrite: true)
                    logger.lifecycle("  Downloaded: ${src.file.name}")
                }
            } catch (ignored) {
                logger.debug("No sources available for ${id.group}:${id.name}:${id.version}")
            }
        }
    }
}
