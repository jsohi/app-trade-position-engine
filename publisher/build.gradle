plugins {
    id 'java-library'
    id 'application'
}

application {
    mainClass = 'com.bofa.equity.PublisherApp'
    applicationDefaultJvmArgs = [
        '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
        '--add-opens', 'java.base/jdk.internal.misc=ALL-UNNAMED'
    ]
}

tasks.named('run') {
    systemProperties System.properties
}

dependencies {
    implementation project(':shared')
    runtimeOnly group: 'org.apache.logging.log4j', name: 'log4j-core', version: LOG4J_VERSION
    runtimeOnly group: 'com.lmax', name: 'disruptor', version: DISRUPTOR_VERSION
    testRuntimeOnly group: 'org.apache.logging.log4j', name: 'log4j-core', version: LOG4J_VERSION
    testRuntimeOnly group: 'com.lmax', name: 'disruptor', version: DISRUPTOR_VERSION
    testRuntimeOnly group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.11.4'
    testRuntimeOnly group: 'org.junit.platform', name: 'junit-platform-launcher', version: '1.11.4'
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.11.4'
}

test {
    useJUnitPlatform()
    jvmArgs('--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED')
    jvmArgs('--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED')
    jvmArgs('--add-opens', 'java.base/jdk.internal.misc=ALL-UNNAMED')
    testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}
